<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartSchool | Mark Attendance</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    color-scheme: light;
--accent: #2563eb;
--accent-strong: #1d4ed8;
--accent-soft: rgba(37,99,235,0.10);
--bg: #f3f7ff;
--surface: rgba(255,255,255,0.88);
--surface-muted: #f8fbff;
--text-main: #0f172a;
--text-muted: #475569;
--border: rgba(148,163,184,0.22);
--success: #16a34a;
--success-soft: rgba(22,163,74,0.12);
--error: #b91c1c;
--error-soft: rgba(239,68,68,0.12);
--shadow: 0 22px 50px rgba(15,23,42,0.10);
}

 :root[data-theme='dark'] {
    color-scheme: dark;
--accent: #60a5fa;
--accent-strong: #93c5fd;
--accent-soft: rgba(96,165,250,0.12);
--bg: #0f172a;
--surface: rgba(15,23,42,0.9);
--surface-muted: #111827;
--text-main: #e2e8f0;
--text-muted: #94a3b8;
--border: rgba(148,163,184,0.18);
--success: #4ade80;
--success-soft: rgba(74,222,128,0.14);
--error: #fca5a5;
--error-soft: rgba(252,165,165,0.14);
--shadow: 0 22px 50px rgba(2,6,23,0.32);
}

* { box-sizing: border-box; }

body {
    min-height: 100vh;
    margin: 0;
    padding: 36px 24px;
    color: var(--text-main);
background:
    radial-gradient(circle at top left, rgba(37,99,235,0.12), transparent 28%),
    radial-gradient(circle at bottom right, rgba(14,165,233,0.12), transparent 28%),
    linear-gradient(135deg, #f0f7ff 0%, var(--bg) 100%);
font-family: 'Manrope', sans-serif;
transition: background-color 180ms ease, color 180ms ease;
}

.attendance-shell {
width: min(100%, 980px);
margin: 0 auto;
}

.page-header {
display: flex;
align-items: center;
justify-content: space-between;
gap: 20px;
margin-bottom: 28px;
flex-wrap: wrap;
}

.brand-lockup, .page-actions { display: flex; align-items: center; }
.brand-lockup { gap: 13px; min-width: 0; }
.brand-mark {
display: grid;
place-items: center;
width: 48px;
height: 48px;
flex: 0 0 auto;
border-radius: 14px;
background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
color: #fff;
font-size: 19px;
box-shadow: 0 14px 22px rgba(37,99,235,0.18);
}
.eyebrow {
display: block;
color: var(--accent);
font-size: 10px;
font-weight: 800;
letter-spacing: 1px;
}
.brand-lockup h1 { margin: 2px 0 0; font-size: 22px; font-weight: 800; letter-spacing: -0.04em; }
.page-actions { gap: 9px; }
.icon-button, .theme-toggle {
display: inline-flex;
align-items: center;
justify-content: center;
min-height: 42px;
border: 1px solid var(--border);
border-radius: 12px;
background: var(--surface);
color: var(--text-main);
cursor: pointer;
transition: border-color 150ms ease, background-color 150ms ease, color 150ms ease, transform 150ms ease;
}
.icon-button { position: relative; width: 42px; padding: 0; font-size: 15px; }
.theme-toggle { gap: 9px; padding: 0 13px; font: inherit; font-size: 12px; font-weight: 700; }
.icon-button:hover, .theme-toggle:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
.icon-button:focus-visible, .theme-toggle:focus-visible, .btn-submit:focus-visible, .issue-actions button:focus-visible, select:focus-visible, textarea:focus-visible {
outline: 3px solid rgba(37,99,235,0.18);
outline-offset: 2px;
}
.notify-badge {
position: absolute;
top: -5px;
right: -5px;
display: none;
min-width: 18px;
padding: 2px 5px;
border-radius: 999px;
background: #ef4444;
color: #fff;
font-size: 10px;
line-height: 1.2;
}

.notification-dropdown {
display: none;
position: fixed;
top: 82px;
right: max(20px, calc((100vw - 920px) / 2));
z-index: 1002;
width: min(340px, calc(100vw - 32px));
max-height: 60vh;
overflow: auto;
padding: 10px;
border: 1px solid var(--border);
border-radius: 14px;
background: var(--surface);
box-shadow: var(--shadow);
}

.attendance-workspace {
display: grid;
grid-template-columns: minmax(220px, 0.78fr) minmax(0, 1.22fr);
gap: 30px;
padding: 30px;
border: 1px solid var(--border);
border-radius: 24px;
background: var(--surface);
box-shadow: var(--shadow);
}

.clock-panel {
display: flex;
flex-direction: column;
justify-content: center;
min-width: 0;
padding-right: 28px;
border-right: 1px solid var(--border);
}
.clock-label { margin: 0 0 14px; color: var(--text-muted); font-size: 11px; font-weight: 800; letter-spacing: 1px; }
#time {
color: var(--accent);
font-family: 'IBM Plex Mono', 'Courier New', monospace;
font-size: clamp(30px, 4vw, 39px);
font-weight: 600;
font-variant-numeric: tabular-nums;
white-space: nowrap;
}
#date { margin-top: 9px; color: var(--text-muted); font-size: 13px; line-height: 1.6; }
.clock-rule { width: 44px; height: 3px; margin-top: 24px; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent-strong)); }
.entry-panel { min-width: 0; padding: 3px 0 3px 2px; }
.section-heading { margin-bottom: 23px; }
.section-heading h2 { margin: 5px 0 0; font-size: 23px; line-height: 1.25; }
.entry-form { display: flex; flex-direction: column; gap: 19px; }
.field-label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 12px; font-weight: 800; }
select {
width: 100%;
min-height: 50px;
padding: 0 42px 0 14px;
appearance: none;
border: 1px solid var(--border);
border-radius: 12px;
background-color: var(--surface-muted);
background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23647772' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
background-repeat: no-repeat;
background-position: right 14px center;
background-size: 16px;
color: var(--text-main);
font: inherit;
font-size: 14px;
}
select:focus-visible, textarea:focus-visible { border-color: var(--accent); }
.btn-submit {
display: inline-flex;
align-items: center;
justify-content: center;
gap: 10px;
min-height: 50px;
padding: 0 18px;
border: 0;
border-radius: 12px;
background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
color: #fff;
cursor: pointer;
font: inherit;
font-size: 14px;
font-weight: 800;
transition: background-color 150ms ease, transform 150ms ease, box-shadow 150ms ease;
box-shadow: 0 14px 22px rgba(37,99,235,0.18);
}
.btn-submit:hover { transform: translateY(-1px); background: linear-gradient(135deg, var(--accent-strong) 0%, var(--accent) 100%); }
.btn-submit:disabled, .issue-actions button:disabled { cursor: wait; opacity: 0.65; transform: none; }
.progress-bar { position: fixed; inset: 0 0 auto; z-index: 1001; display: none; width: 100%; height: 4px; overflow: hidden; background: var(--accent-soft); }
.progress-bar span { display: block; width: 0; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-strong)); transition: width 250ms ease; }
.status-message {
display: none;

    margin-top: 16px;
    padding: 13px 15px;
    border: 1px solid transparent;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.5;
}
.status-message.success { display: block; border-color: #b9dfc8; background: var(--success-soft); color: var(--success); }
.status-message.error { display: block; border-color: #f0c4bf; background: var(--error-soft); color: var(--error); }
.issue-panel {
    display: grid;
    grid-template-columns: minmax(180px, 0.7fr) minmax(0, 1.3fr);
    align-items: start;
    gap: 28px;
    margin-top: 28px;
    padding: 25px 4px 0;
    border-top: 1px solid var(--border);
}
.issue-heading h2 { margin: 5px 0 0; font-size: 17px; }
.issue-form { min-width: 0; }
.issue-form textarea {
    display: block;
    width: 100%;
    min-height: 84px;
    padding: 12px 13px;
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text-main);
    font: inherit;
    font-size: 13px;
    line-height: 1.5;
}
.issue-form textarea::placeholder { color: var(--text-muted); }
.issue-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 10px; }
.issue-actions button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 42px;
    padding: 0 13px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text-main);
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    font-weight: 800;
}
.issue-actions button:first-child { border-color: var(--accent); background: var(--accent); color: #fff; }
.issue-actions button:first-child:hover { background: var(--accent-strong); }
.issue-actions button:last-child:hover { border-color: var(--accent); color: var(--accent); }
#issueMessage { display: none; margin-top: 10px; font-size: 13px; font-weight: 700; }
#issueMessage.success { display: block; color: var(--success); }
#issueMessage.error { display: block; color: var(--error); }
.back-link { display: inline-flex; align-items: center; gap: 8px; margin-top: 22px; color: var(--text-muted); font-size: 12px; font-weight: 700; text-decoration: none; }
.back-link:hover { color: var(--accent); }
.back-link:focus-visible { outline: 3px solid rgba(23, 107, 93, 0.28); outline-offset: 4px; }

@media (max-width: 700px) {
    body { padding: 20px 16px; }
    .attendance-workspace { grid-template-columns: 1fr; gap: 22px; padding: 22px; }
    .clock-panel { padding: 0 0 19px; border-right: 0; border-bottom: 1px solid var(--border); }
    .clock-rule { margin-top: 16px; }
    .issue-panel { grid-template-columns: 1fr; gap: 14px; }
}
@media (max-width: 420px) {
    body { padding: 14px 12px; }
    .page-header { align-items: flex-start; flex-wrap: wrap; gap: 13px; }
    .page-actions { margin-left: auto; }
    .attendance-workspace { padding: 18px 16px; }
    .section-heading h2 { font-size: 21px; }
    .issue-actions { display: grid; grid-template-columns: 1fr; }
    .issue-actions button { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
}
</style>
</head>

<body>
<div id="progressBar" class="progress-bar" aria-hidden="true">
    <span></span>
</div>
<main class="attendance-shell">
<header class="page-header">
    <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true"><i class="fas fa-fingerprint"></i></div>
        <div><span class="eyebrow">STAFF OPERATIONS</span><h1>Attendance</h1></div>
    </div>
    <div class="page-actions">
        <a class="theme-toggle" href="messages.html" aria-label="Open messages">
            <i class="fas fa-message" aria-hidden="true"></i><span>Messages</span>
        </a>
        <button id="notifyBtn" class="icon-button" type="button" title="Notifications" aria-label="Notifications">
            <i class="fas fa-bell" aria-hidden="true"></i>
            <span id="notifyBadge" class="notify-badge">0</span>
        </button>
        <button id="themeToggle" class="theme-toggle" data-theme-toggle type="button"><i class="fas fa-moon" aria-hidden="true"></i><span>Dark mode</span></button>
        <button id="logoutBtn" class="icon-button" type="button" title="Sign out" aria-label="Sign out"><i class="fas fa-arrow-right-from-bracket" aria-hidden="true"></i></button>
    </div>
</header>

<!-- Notifications dropdown -->
<div id="notificationDropdown" class="notification-dropdown">
    <div id="notificationList">Loading notifications...</div>
</div>

<section class="attendance-workspace" aria-label="Attendance entry">
    <div class="clock-panel">
        <p class="clock-label">LOCAL TIME</p>
        <div id="time">00:00:00</div>
        <div id="date">Loading date...</div>
        <div class="clock-rule" aria-hidden="true"></div>
    </div>

    <div class="entry-panel">
        <div class="section-heading">
            <span class="eyebrow">NEW ENTRY</span>
            <h2>Record attendance</h2>
        </div>
        <form id="attendanceForm" class="entry-form">
            <div>
                <label class="field-label" for="teacherSelect">Staff member</label>
                <select name="teacher_id" id="teacherSelect" required>
                    <option value="">Fetching teachers...</option>
                </select>
            </div>
            <div>
                <label class="field-label" for="actionSelect">Attendance type</label>
                <select name="action" id="actionSelect" required>
                    <option value="">Choose action...</option>
                    <option value="checkin">Check-in</option>
                    <option value="checkout">Check-out</option>
                </select>
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="fas fa-fingerprint" aria-hidden="true"></i> Confirm attendance
            </button>
        </form>
        <div id="message" class="status-message" role="status" aria-live="polite"></div>
    </div>
</section>

<section class="issue-panel" aria-labelledby="issueHeading">
    <div class="issue-heading">
        <span class="eyebrow">HELP DESK</span>
        <h2 id="issueHeading">Report an issue</h2>
    </div>
    <div class="issue-form">
        <textarea id="issueText" aria-label="Issue details" placeholder="Describe the issue"></textarea>
        <div class="issue-actions">
            <button id="sendIssueBtn" type="button"><i class="fas fa-paper-plane" aria-hidden="true"></i> Send to Admin</button>
            <button id="sendSuperNoteBtn" type="button"><i class="fas fa-bullhorn" aria-hidden="true"></i> Notify Super Admin</button>
        </div>
        <div id="issueMessage" role="status" aria-live="polite"></div>
    </div>
</section>

<a href="admin.html" class="back-link"><i class="fas fa-arrow-left" aria-hidden="true"></i> Back to dashboard</a>
</main>

<script>

/* CLOCK */

function updateClock(){
const now=new Date();

document.getElementById('time').textContent=now.toLocaleTimeString();

document.getElementById('date').textContent=now.toLocaleDateString('en-GB',{
weekday:'long',
day:'numeric',
month:'long',
year:'numeric'
});
}

setInterval(updateClock,1000);
updateClock();


/* LOAD TEACHERS */

async function loadTeachers(){
    showProgress();
    const select=document.getElementById('teacherSelect');
    select.innerHTML='<option value="">Loading teacher list...</option>';

    try{
        const res=await fetch('/teachers');
        const data=await res.json();

        select.innerHTML='<option value="">Select Teacher</option>';
        data.forEach(t=>{
            const opt=document.createElement('option');
            opt.value=t.id;
            opt.textContent=t.name;
            select.appendChild(opt);
        });
    }catch(err){
        select.innerHTML='<option value="">Error loading list</option>';
        console.error('Teacher list load failed', err);
    } finally {
        hideProgress();
    }
}

const progressBar = document.getElementById('progressBar');
const themeToggle = document.getElementById('themeToggle');
const issueText = document.getElementById('issueText');
const sendIssueBtn = document.getElementById('sendIssueBtn');
const issueMessage = document.getElementById('issueMessage');
const form = document.getElementById('attendanceForm');
const msg = document.getElementById('message');
const btn = document.getElementById('submitBtn');

function setTheme(theme, persist = true) {
    document.documentElement.dataset.theme = theme;
    if (persist) localStorage.setItem('smartschool-theme', theme);
    themeToggle.querySelector('span').textContent = theme === 'dark' ? 'Light mode' : 'Dark mode';
    themeToggle.querySelector('i').className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
}

function loadTheme() {
    const savedTheme = localStorage.getItem('smartschool-theme');
    const preferredTheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    setTheme(savedTheme || preferredTheme, Boolean(savedTheme));
}

function showProgress() {
    progressBar.style.display = 'block';
    progressBar.firstElementChild.style.width = '25%';
}

function updateProgress(percent) {
    progressBar.firstElementChild.style.width = `${percent}%`;
}

function hideProgress() {
    progressBar.firstElementChild.style.width = '100%';
    setTimeout(() => {
        progressBar.style.display = 'none';
        progressBar.firstElementChild.style.width = '0';
    }, 250);
}

loadTeachers();

async function sendIssue() {
    const message = issueText.value.trim();
    if (!message) {
        issueMessage.style.display = 'block';
        issueMessage.textContent = 'Please explain the problem before sending.';
        issueMessage.style.color = '#b91c1c';
        return;
    }

    sendIssueBtn.disabled = true;
    sendIssueBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Sending...';
    showProgress();
    updateProgress(40);

    try {
        const res = await fetch('/messages/teacher', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message })
        });

        const data = await res.json();
        updateProgress(80);

        issueMessage.style.display = 'block';
        issueMessage.className = data.status === 'success' ? 'success' : 'error';
        issueMessage.textContent = data.message || 'Could not send your message.';

        if (data.status === 'success') {
            issueText.value = '';
        }
    } catch (err) {
        issueMessage.style.display = 'block';
        issueMessage.className = 'error';
        issueMessage.textContent = 'Unable to connect with the server. Please try again.';
    } finally {
        hideProgress();
        sendIssueBtn.disabled = false;
        sendIssueBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Message';
        setTimeout(() => { issueMessage.style.display = 'none'; }, 5000);
    }
}

form.addEventListener('submit',async function(e){

e.preventDefault();

btn.disabled=true;
btn.innerHTML='<i class="fas fa-circle-notch fa-spin"></i> Processing...';
showProgress();
updateProgress(35);

const teacher_id=document.getElementById('teacherSelect').value;
const action=document.getElementById('actionSelect').value;

try{

const res=await fetch('/save-attendance',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({teacher_id,action})
});

const data = await res.json();
updateProgress(75);

msg.style.display='block';

if(data.status === 'success'){

msg.className='status-message success';
msg.textContent='Attendance logged successfully!';

form.reset();

}else{

msg.className='status-message error';
msg.textContent=data.message || 'Unable to save attendance.';

}

}catch(err){

msg.style.display='block';
msg.className='status-message error';
msg.textContent='Network error. Please check connection.';

}

finally{

btn.disabled=false;
btn.innerHTML='<i class="fas fa-fingerprint"></i> Confirm Attendance';
hideProgress();

setTimeout(()=>{
msg.style.display='none';
},4000);

}

});

sendIssueBtn.addEventListener('click', sendIssue);

// Teacher -> Superadmin notification
const sendSuperNoteBtn = document.getElementById('sendSuperNoteBtn');
async function sendSuperNotification() {
    const message = issueText.value.trim();
    if (!message) {
        issueMessage.style.display = 'block';
        issueMessage.textContent = 'Please provide a message to notify super admin.';
        issueMessage.style.color = '#b91c1c';
        return;
    }

    sendSuperNoteBtn.disabled = true;
    sendSuperNoteBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Sending...';
    showProgress();
    updateProgress(40);

    try {
        const res = await fetch('/messages/notification', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message })
        });
        const data = await res.json();
        updateProgress(80);
        issueMessage.style.display = 'block';
        issueMessage.className = data.status === 'success' ? 'success' : 'error';
        issueMessage.textContent = data.message || 'Could not notify super admin.';
        if (data.status === 'success') issueText.value = '';
    } catch (err) {
        issueMessage.style.display = 'block';
        issueMessage.className = 'error';
        issueMessage.textContent = 'Unable to connect to server.';
    } finally {
        hideProgress();
        sendSuperNoteBtn.disabled = false;
        sendSuperNoteBtn.innerHTML = '<i class="fas fa-bullhorn"></i> Notify Super Admin';
        setTimeout(()=>{ issueMessage.style.display='none'; },5000);
    }
}

sendSuperNoteBtn.addEventListener('click', sendSuperNotification);
loadTheme();

themeToggle.addEventListener('click', () => {
    const currentTheme = document.documentElement.dataset.theme || 'light';
    setTheme(currentTheme === 'dark' ? 'light' : 'dark');
});

document.getElementById('logoutBtn').addEventListener('click', async (event) => {
    const button = event.currentTarget;
    button.disabled = true;
    try {
        await fetch('/logout', { method: 'POST' });
    } finally {
        window.location.assign('/');
    }
});

// -------------------------
// Notifications + polling
// -------------------------
const notifyBtn = document.getElementById('notifyBtn');
const notifyBadge = document.getElementById('notifyBadge');
const notificationDropdown = document.getElementById('notificationDropdown');
const notificationList = document.getElementById('notificationList');

function renderNotifications(list) {
    if (!Array.isArray(list) || list.length === 0) {
        notificationList.innerHTML = '<div style="padding:12px;color:var(--text-muted);">No notifications</div>';
        notifyBadge.style.display = 'none';
        return;
    }
    const unreadCount = list.filter(notification => !notification.is_read).length;
    notifyBadge.style.display = unreadCount ? 'inline-block' : 'none';
    notifyBadge.textContent = unreadCount;
    const items = document.createDocumentFragment();
    list.slice(0, 8).forEach(n => {
        const item = document.createElement('div');
        item.style.cssText = 'padding:10px;border-bottom:1px solid rgba(0,0,0,0.04);';
        const sender = document.createElement('strong');
        sender.style.display = 'block';
        sender.textContent = n.sender_name || 'System';
        const createdAt = document.createElement('small');
        createdAt.style.color = 'var(--text-muted)';
        createdAt.textContent = new Date(n.created_at).toLocaleString();
        const message = document.createElement('div');
        message.style.cssText = 'margin-top:8px;color:var(--text-main);';
        message.textContent = n.message || '';
        item.append(sender, createdAt, message);
        items.append(item);
    });
    notificationList.replaceChildren(items);
}

async function loadNotifications() {
    try {
        const res = await fetch('/messages/notification', { cache: 'no-store' });
        if (!res.ok) throw new Error('Notifications request failed.');
        const data = await res.json();
        renderNotifications(data);
    } catch (err) {
        console.warn('Notifications fetch failed', err);
    }
}

async function markNotificationsRead() {
    const response = await fetch('/messages/notification/read', { method: 'PATCH' });
    const result = await response.json();
    if (!response.ok || result.status !== 'success') {
        throw new Error(result.message || 'Unable to mark notifications as read.');
    }
}

async function toggleNotifications() {
    if (notificationDropdown.style.display === 'none' || notificationDropdown.style.display === '') {
        notificationDropdown.style.display = 'block';
        try {
            await markNotificationsRead();
        } catch (error) {
            alert(error.message || 'Unable to mark notifications as read.');
        }
        await loadNotifications();
    } else {
        notificationDropdown.style.display = 'none';
    }
}

notifyBtn.addEventListener('click', () => { toggleNotifications(); });

// Poll notifications every 60s
setInterval(loadNotifications, 60000);
// initial load
loadNotifications();

</script>
