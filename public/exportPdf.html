<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartSchool | Export Center</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="assets/theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-strong: #1d4ed8;
            --bg: #f3f7ff;
            --panel: rgba(255,255,255,0.9);
            --panel-soft: #f8fbff;
            --line: rgba(148,163,184,0.22);
            --text: #0f172a;
            --muted: #475569;
            --success: #16a34a;
            --danger: #ef4444;
            --shadow: 0 24px 60px rgba(15,23,42,0.10);
        }

        body {
            background:
                radial-gradient(circle at top left, rgba(37,99,235,0.12), transparent 28%),
                radial-gradient(circle at bottom right, rgba(14,165,233,0.12), transparent 28%),
                linear-gradient(135deg, #f4f8ff 0%, var(--bg) 100%);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            color: var(--text);
        }

        .card {
            background: var(--panel);
            padding: 38px 32px 30px;
            border-radius: 28px;
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 440px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .icon-wrap {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, rgba(37,99,235,0.12), rgba(14,165,233,0.12));
            color: var(--primary);
            border: 1px solid rgba(37,99,235,0.10);
            box-shadow: 0 18px 36px rgba(37,99,235,0.12);
        }

        h2 {
            margin: 0 0 8px;
            font-size: clamp(1.8rem, 3vw, 2.3rem);
            letter-spacing: -0.05em;
        }

        p {
            margin: 0 0 18px;
            color: var(--muted);
            line-height: 1.6;
        }

        select {
            width: 100%;
            padding: 14px 16px;
            margin: 18px 0;
            border-radius: 12px;
            border: 1.5px solid var(--line);
            background: var(--panel-soft);
            font-size: 15px;
            outline: none;
            color: var(--text);
        }

        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37,99,235,0.10);
        }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn {
            padding: 14px 12px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
            box-shadow: 0 14px 24px rgba(15,23,42,0.08);
        }
        .pdf { background: linear-gradient(135deg, #f87171 0%, #dc2626 100%); }
        .csv { background: linear-gradient(135deg, #34d399 0%, #16a34a 100%); }
        .btn:hover { opacity: 0.96; transform: translateY(-2px); }
        #status {
            margin-top: 16px;
            font-size: 13px;
            color: var(--primary);
            display: none;
            font-weight: 600;
        }
        #status.error { color: var(--danger); }
        .btn:disabled { cursor: wait; opacity: 0.65; transform: none; }
    </style>
</head>
<body>

<div class="card">
    <i class="fa-solid fa-file-export" style="font-size: 40px; color: var(--primary); margin-bottom: 15px;"></i>
    <h2>Export Reports</h2>
    <p style="color: #64748b;">Select a teacher to generate attendance files.</p>

    <select id="teacherSelect" aria-label="Select a teacher">
        <option value="">All Faculty (Consolidated)</option>
    </select>

    <div id="status" role="status" aria-live="polite"></div>

    <div class="btn-group">
        <button class="btn pdf" type="button" onclick="triggerExport('pdf')"><i class="fa-solid fa-file-pdf"></i> PDF</button>
        <button class="btn csv" type="button" onclick="triggerExport('csv')"><i class="fa-solid fa-file-csv"></i> CSV</button>
    </div>
</div>

<script>
    const select = document.getElementById('teacherSelect');
    const status = document.getElementById('status');
    const exportButtons = document.querySelectorAll('.btn');

    function showStatus(message, isError = false, isLoading = false) {
        status.className = isError ? 'error' : '';
        status.innerHTML = isLoading
            ? '<i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i> '
            : '';
        status.append(document.createTextNode(message));
        status.style.display = 'block';
    }

    async function loadTeachers() {
        try {
            const res = await fetch('/teachers', { headers: { Accept: 'application/json' } });
            if (!res.ok) throw new Error('Unable to load the teacher list.');
            const teachers = await res.json();
            teachers.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.id;
                opt.textContent = t.name;
                select.appendChild(opt);
            });
        } catch (err) {
            showStatus(err.message || 'Unable to load the teacher list.', true);
        }
    }

    async function triggerExport(type) {
        const selectedOption = select.options[select.selectedIndex];
        const params = new URLSearchParams();
        let endpoint;
        let expectedType;

        if (type === 'pdf') {
            endpoint = '/export-pdf';
            expectedType = 'application/pdf';
            params.set('download', 'true');
            if (select.value) {
                params.set('teacher_id', select.value);
                params.set('teacher', selectedOption.textContent);
            }
        } else {
            endpoint = '/monthly-report';
            expectedType = 'text/csv';
            params.set('format', 'csv');
            const now = new Date();
            params.set('month', `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`);
            if (select.value) params.set('teacher', selectedOption.textContent);
        }

        exportButtons.forEach(button => { button.disabled = true; });
        showStatus(`Generating ${type.toUpperCase()} file...`, false, true);

        try {
            const response = await fetch(`${endpoint}?${params.toString()}`, {
                headers: { Accept: `${expectedType}, application/json` }
            });
            if (!response.ok) {
                const contentType = response.headers.get('content-type') || '';
                const message = contentType.includes('application/json')
                    ? (await response.json()).message
                    : await response.text();
                throw new Error(message || `Export failed (${response.status}).`);
            }

            const contentType = response.headers.get('content-type') || '';
            if (!contentType.includes(expectedType)) {
                throw new Error('The server returned an unexpected file format.');
            }

            const blob = await response.blob();
            const objectUrl = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = objectUrl;
            link.download = type === 'pdf' ? 'Attendance_Report.pdf' : `Monthly_Report_${params.get('month')}.csv`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(objectUrl);
            showStatus(`${type.toUpperCase()} report downloaded.`);
        } catch (err) {
            showStatus(err.message || 'Export failed. Please try again.', true);
        } finally {
            exportButtons.forEach(button => { button.disabled = false; });
        }
    }

    loadTeachers();
</script>
<script src="assets/theme.js"></script>
</body>
</html>
