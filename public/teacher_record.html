<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Teacher Attendance Record</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/theme.css">

<style>
:root{
  --primary:#2563eb;
  --primary-hover:#1d4ed8;
  --dark:#1e293b;
  --gray:#64748b;
  --table-header:#1e40af;
  --table-row-even:#f1f5f9;
  --table-row-hover:#e0f2fe;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Segoe UI,sans-serif;}
body{background:linear-gradient(135deg,#eef2ff,#f8fafc);padding:30px;}
.container{max-width:1100px;margin:auto;background:#fff;padding:30px;border-radius:18px;box-shadow:0 20px 40px rgba(0,0,0,.08);}
.header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:25px;}
.header h2{font-size:28px;color:var(--dark);}
.actions{display:flex;gap:10px;flex-wrap:wrap;}
.btn{padding:10px 18px;border-radius:10px;color:#fff;text-decoration:none;font-weight:600;background:var(--primary);}
.btn.secondary{background:var(--gray);}
.teacher-card{background:#f1f5f9;padding:18px;border-radius:14px;margin-bottom:20px;font-weight:600;}
table{width:100%;border-collapse:collapse;}
th,td{padding:14px;text-align:center;border-bottom:1px solid #e2e8f0;}
th{background:var(--table-header);color:#fff;}
tr:nth-child(even){background:var(--table-row-even);}
tr:hover{background:var(--table-row-hover);}
.empty{text-align:center;color:#64748b;padding:20px;}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h2>📘 Teacher Attendance Record</h2>
    <div class="actions">
      <a id="pdfBtn" class="btn" target="_blank">📄 Export PDF</a>
      <a id="csvBtn" class="btn" target="_blank">📑 Export CSV</a>
      <a href="report.html" class="btn secondary">⬅ Back to Report</a>
    </div>
  </div>

  <div class="teacher-card" id="teacherInfo">Loading...</div>

  <table>
    <thead>
      <tr>
        <th>Day</th>
        <th>Date</th>
        <th>Check In</th>
        <th>Check Out</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="4">Loading...</td></tr>
    </tbody>
  </table>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const teacher = params.get('teacher');

async function loadTeacherRecord(){
  const teacherInfoDiv = document.getElementById('teacherInfo');
  const tbody = document.getElementById('tbody');

  if(!teacher){
    teacherInfoDiv.textContent = 'No teacher selected';
    tbody.innerHTML = `<tr><td colspan="4" class="empty">No data to display</td></tr>`;
    document.getElementById('pdfBtn').href = '#';
    document.getElementById('csvBtn').href = '#';
    return;
  }

  try {
    const res = await fetch(`/teacher-record?teacher=${encodeURIComponent(teacher)}`);
    if(res.status === 401) return window.location = 'login.html';

    if(!res.ok) throw new Error('Failed to fetch data');

    const json = await res.json();

    if(!json.teacher){
      teacherInfoDiv.textContent = 'Teacher not found';
      tbody.innerHTML = `<tr><td colspan="4" class="empty">No data to display</td></tr>`;
      document.getElementById('pdfBtn').href = '#';
      document.getElementById('csvBtn').href = '#';
      return;
    }

    const teacherLabel = document.createElement('strong');
    teacherLabel.textContent = 'Teacher: ';
    teacherInfoDiv.replaceChildren(teacherLabel, document.createTextNode(json.teacher.name));
    document.getElementById('pdfBtn').href = `/export-pdf?teacher_id=${json.teacher.id}`;
    document.getElementById('csvBtn').href = `/export-csv?teacher_id=${json.teacher.id}`;

    tbody.replaceChildren();
    if(!json.records || json.records.length === 0){
      tbody.innerHTML = `<tr><td colspan="4" class="empty">No attendance records found</td></tr>`;
      return;
    }

    json.records.forEach(record=>{
      const row = document.createElement('tr');
      [record.day, String(record.date || '').split('T')[0], record.check_in || '-', record.check_out || '-']
        .forEach(value => {
          const cell = document.createElement('td');
          cell.textContent = String(value);
          row.append(cell);
        });
      tbody.append(row);
    });

  } catch(err){
    console.error(err);
    teacherInfoDiv.textContent = 'Error loading data';
    tbody.innerHTML = `<tr><td colspan="4" class="empty">Something went wrong</td></tr>`;
    document.getElementById('pdfBtn').href = '#';
    document.getElementById('csvBtn').href = '#';
  }
}

loadTeacherRecord();
</script>

<script src="assets/theme.js"></script>
</body>
</html>
