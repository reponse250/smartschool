<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/theme.css">
    <title>Signing out...</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-strong: #1d4ed8;
            --bg: #f3f7ff;
            --panel: rgba(255,255,255,0.9);
            --line: rgba(148,163,184,0.22);
            --text: #0f172a;
            --muted: #475569;
            --danger: #ef4444;
            --shadow: 0 24px 60px rgba(15,23,42,0.12);
        }

        body {
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:
                radial-gradient(circle at top left, rgba(37,99,235,0.12), transparent 24%),
                radial-gradient(circle at bottom right, rgba(14,165,233,0.12), transparent 26%),
                linear-gradient(135deg, #f4f8ff 0%, var(--bg) 100%);
            font-family:Inter, sans-serif;
            padding: 24px;
        }

        .logout-card {
            background: var(--panel);
            padding: 34px 30px 28px;
            border-radius: 28px;
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            text-align:center;
            max-width: 440px;
            width: 100%;
            backdrop-filter: blur(10px);
        }

        .logout-card h1 {
            font-size: clamp(1.8rem, 3vw, 2.4rem);
            margin-bottom: 12px;
            color: var(--text);
            letter-spacing: -0.05em;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .logout-card {
                padding: 24px 18px 20px;
                border-radius: 20px;
            }

            .logout-card p {
                font-size: 0.94rem;
            }
        }

        .logout-card p {
            color: var(--muted);
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .progress-bar {
            position:relative;
            width:100%;
            height: 10px;
            border-radius: 999px;
            background: rgba(148,163,184,0.2);
            overflow:hidden;
        }

        .progress-bar span {
            display:block;
            width:0%;
            height:100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-strong));
            transition:width 0.4s ease;
        }
    </style>
</head>
<body>
    <div class="logout-card">
        <h1>Signing out...</h1>
        <p>Please wait while we end your session and secure your account.</p>
        <div class="progress-bar"><span id="logoutProgress"></span></div>
    </div>

    <script>
        const bar = document.getElementById('logoutProgress');
        let value = 10;
        const interval = setInterval(() => {
            if (value >= 100) return clearInterval(interval);
            value += 15;
            bar.style.width = value + '%';
        }, 120);

        fetch('/logout', { method: 'GET' })
            .then(() => {
                bar.style.width = '100%';
                setTimeout(() => window.location.href = 'index.html', 250);
            })
            .catch(() => {
                bar.style.background = '#ef4444';
                document.querySelector('.logout-card p').textContent = 'Unable to sign out. Please try again.';
            });
    </script>
<script src="assets/theme.js"></script>
</body>
</html>
