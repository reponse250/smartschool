<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
  --primary: #2563eb;
  --primary-strong: #1d4ed8;
  --bg: #f3f7ff;
  --panel: rgba(255,255,255,0.9);
  --panel-soft: #f8fbff;
  --line: rgba(148,163,184,0.22);
  --text: #0f172a;
  --muted: #475569;
  --shadow: 0 24px 60px rgba(15,23,42,0.12);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background:
    radial-gradient(circle at top left, rgba(37,99,235,0.12), transparent 28%),
    radial-gradient(circle at bottom right, rgba(14,165,233,0.10), transparent 30%),
    linear-gradient(135deg, #f4f8ff 0%, var(--bg) 100%);
  color: var(--text);
}

header {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-strong) 100%);
  color: #fff;
  padding: 26px 20px;
  text-align: center;
  font-size: clamp(1.5rem, 2vw, 2.2rem);
  font-weight: 800;
  letter-spacing: -0.05em;
  box-shadow: 0 18px 32px rgba(37,99,235,0.18);
}

.container {
  max-width: 980px;
  margin: 36px auto;
  padding: 26px 22px 30px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 28px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(10px);
}

h3 {
  margin: 0 0 14px;
  font-size: 1.15rem;
  letter-spacing: -0.03em;
}

textarea {
  width: 100%;
  min-height: 180px;
  resize: vertical;
  padding: 16px 18px;
  border: 1.5px solid var(--line);
  border-radius: 16px;
  background: var(--panel-soft);
  color: var(--text);
  font: inherit;
  margin-bottom: 16px;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(37,99,235,0.10);
}

button {
  padding: 12px 22px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-strong) 100%);
  color: #fff;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 700;
  box-shadow: 0 14px 24px rgba(37,99,235,0.18);
  transition: transform 0.2s ease, filter 0.2s ease;
}

button:hover {
  transform: translateY(-1px);
  filter: brightness(0.98);
}

@media (max-width: 700px) {
  .container {
    margin: 22px 14px;
    padding: 20px 16px 24px;
    border-radius: 20px;
  }

  textarea {
    min-height: 150px;
  }
}

@media (max-width: 420px) {
  header {
    padding: 20px 16px;
    font-size: 1.25rem;
  }

  .container {
    margin: 16px 10px;
    padding: 18px 12px 20px;
  }

  button {
    width: 100%;
  }
}

#preview {
  margin-top: 22px;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(248,250,252,0.96));
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
}

.preview-item {
  padding: 14px 16px;
  margin: 10px 0;
  border: 1px solid rgba(37,99,235,0.12);
  background: rgba(37,99,235,0.02);
  border-radius: 12px;
  color: var(--text);
  font-weight: 600;
}
</style>
</head>
<body>
<header>Admin Dashboard Builder</header>
<div class="container">
  <h3>Define your interface layout (JSON)</h3>
  <textarea id="layoutInput" placeholder='[{"type":"widget","content":"Welcome Widget"}]'></textarea>
  <br>
  <button id="saveBtn">Save Layout</button>
  <h3>Preview</h3>
  <div id="preview"></div>
</div>

<script>
const layoutInput = document.getElementById('layoutInput');
const preview = document.getElementById('preview');

// Fetch saved layout
async function loadLayout() {
  try {
    const res = await fetch('/admin-interface/layout', { credentials: 'include' });
    const data = await res.json();
    if(data.layout) {
      layoutInput.value = JSON.stringify(data.layout, null, 2);
      renderPreview(data.layout);
    }
  } catch(err) { console.error(err); }
}

// Render preview
function renderPreview(layout) {
  preview.innerHTML = '';
  layout.forEach(widget => {
    const div = document.createElement('div');
    div.className = 'preview-item';
    div.textContent = widget.content || 'Widget';
    preview.appendChild(div);
  });
}

// Save layout
document.getElementById('saveBtn').addEventListener('click', async () => {
  try {
    const layout = JSON.parse(layoutInput.value);
    const res = await fetch('/admin-interface/save', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      credentials:'include',
      body: JSON.stringify({ layout })
    });
    const data = await res.json();
    alert(data.message);
    renderPreview(layout);
  } catch(err) { alert('Invalid JSON'); }
});

loadLayout();
</script>
<script src="assets/theme.js"></script>
</body>
</html>
